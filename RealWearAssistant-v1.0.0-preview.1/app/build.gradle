plugins { id 'com.android.application' }
android {
    namespace 'com.fred.realweargpt'
    compileSdk 35
    defaultConfig {
        applicationId 'com.fred.realweargpt'
        minSdk 27
        targetSdk 35
        versionCode 104
        versionName '1.0.0-preview.5'
        testInstrumentationRunner 'com.fred.realweargpt.WearHfInstrumentation'
    }
    signingConfigs {
        debug {
            storeFile rootProject.file('dev-signing/realwear-debug.jks')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes { debug { debuggable true }; release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    testOptions {
        unitTests.returnDefaultValues = false
        unitTests.includeAndroidResources = true
    }
    lint { abortOnError true }
}
dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
